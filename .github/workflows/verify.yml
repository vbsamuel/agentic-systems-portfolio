name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run both workflows
        run: PYTHONPATH=src python examples/run_workflows.py
